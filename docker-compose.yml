# Runs the whole Task Scheduler Platform.
# Each service is built straight from its GitHub repository (main branch).
# Service URLs carry only scheme, host and port; the full path lives in each Feign client.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: usuario
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d usuario"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "8025:8025"   # fake inbox at http://localhost:8025

  usuario:
    build:
      context: https://github.com/GabrielBarrilli/usuario.git#main
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/usuario
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  agendador-tarefas:
    build:
      context: https://github.com/GabrielBarrilli/agendador-tarefas.git#main
    ports:
      - "8081:8081"
    environment:
      MONGODB_URI: mongodb://mongo:27017/agendador-tarefas
      USUARIO_URL: http://usuario:8080
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      - mongo
      - usuario

  notificacao:
    build:
      context: https://github.com/GabrielBarrilli/notificacao.git#main
    ports:
      - "8082:8082"
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      - mailpit

  bff-agendador-tarefas:
    build:
      context: https://github.com/GabrielBarrilli/bff-agendador-tarefas.git#main
    ports:
      - "8083:8083"
    environment:
      USUARIO_URL: http://usuario:8080
      AGENDADOR_TAREFAS_URL: http://agendador-tarefas:8081
      NOTIFICACAO_URL: http://notificacao:8082
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      - usuario
      - agendador-tarefas
      - notificacao

volumes:
  postgres_data:
  mongo_data:
