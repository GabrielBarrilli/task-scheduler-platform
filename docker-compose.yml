# Runs the whole Task Scheduler Platform.
# Each service is built straight from its GitHub repository (main branch).
# Status: draft — see issue "Run the whole stack with docker compose up".
# TODO: confirm the base paths of the *_URL variables against each service's controllers (/v1/...).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: usuario
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d usuario"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  usuario:
    build:
      context: https://github.com/GabrielBarrilli/usuario.git#main
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/usuario
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  agendador-tarefas:
    build:
      context: https://github.com/GabrielBarrilli/agendador-tarefas.git#main
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/agendador-tarefas
      USUARIO_URL: http://usuario:8080
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mongo
      - usuario

  notificacao:
    build:
      context: https://github.com/GabrielBarrilli/notificacao.git#main
    ports:
      - "8082:8082"
    environment:
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      ENVIO_EMAIL_REMETENTE: ${MAIL_USERNAME}

  bff-agendador-tarefas:
    build:
      context: https://github.com/GabrielBarrilli/bff-agendador-tarefas.git#main
    ports:
      - "8083:8083"
    environment:
      USUARIO_URL: http://usuario:8080/v1/usuario
      AGENDADOR_TAREFAS_URL: http://agendador-tarefas:8081/v1
      NOTIFICACAO_URL: http://notificacao:8082/v1/email
      USUARIO_EMAIL: ${JOB_USER_EMAIL}
      USUARIO_SENHA: ${JOB_USER_PASSWORD}
    depends_on:
      - usuario
      - agendador-tarefas
      - notificacao

volumes:
  postgres_data:
  mongo_data:
